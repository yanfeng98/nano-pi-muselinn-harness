name: Release Drafter

template: |
  ## What's new in $RESOLVED_VERSION

  $CHANGES

  ## Install

  ```bash
  pi install npm:pi-muselinn-harness
  npm install pi-muselinn-harness@$RESOLVED_VERSION
  ```

  ## Compatibility

  - pi 0.81.x–0.83.x
  - Node 22/24

category-template: "## $TITLE"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-template: $MAJOR.$MINOR.$PATCH
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
  patch:
    labels:
      - "patch"
  default: patch
