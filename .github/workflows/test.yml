name: test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # devDependencies: jiti (CJS-loader suites) + typescript
      # (tests/ts-esm-loader.mjs, kept for older node legs; node >= 22.18
      # uses native type stripping via tests/run-all.mjs) + the pi packages
      # pinned to the tested 0.83.x line — the typecheck step needs their
      # .d.ts, and they're peers of the published package, not prod deps.
      - run: npm ci --no-audit --no-fund --legacy-peer-deps

      # node tests/run-all.mjs — spawns every tests/*.test.mjs, picks the
      # right TS loading strategy for the node version.
      - run: npm test

      # tsc over the whole package — catches type-layer breakage the
      # runtime JIT tests can't see (stripped annotations, peer drift).
      - run: npm run typecheck
