name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: npm ci
      - run: node tests/run-all.mjs

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Release body comes from CHANGELOG.md (single source of truth),
      # not PR aggregation — direct-to-main commits would otherwise ship
      # as "No changes". The script fails if the version section is missing.
      - name: Build release body from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/release-body.mjs > "$RUNNER_TEMP/release-body.md"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: $RUNNER_TEMP/release-body.md
