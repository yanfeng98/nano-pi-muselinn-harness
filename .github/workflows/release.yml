name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: npm ci
      - run: node tests/run-all.mjs

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Release body comes from CHANGELOG.md (single source of truth),
      # not PR aggregation — direct-to-main commits would otherwise ship
      # as "No changes". The script fails if the version section is missing.
      # gh CLI (preinstalled) avoids third-party actions that still run on
      # the deprecated node 20 runtime.
      - name: Publish release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/release-body.mjs > "$RUNNER_TEMP/release-body.md"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
          || gh release edit "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-body.md"
