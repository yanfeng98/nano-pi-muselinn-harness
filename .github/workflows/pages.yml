name: pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The changelog page includes docs/_includes/changelog.md; generate it
      # from the canonical CHANGELOG.md at build time so the site can never
      # drift from the release notes. (A committed symlink does NOT work —
      # GitHub Pages runs Jekyll in safe mode, which forbids symlinks.)
      - run: cp CHANGELOG.md docs/_includes/changelog.md
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
